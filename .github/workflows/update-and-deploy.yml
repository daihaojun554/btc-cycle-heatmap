name: 更新 BTC 数据并部署

# 每小时抓一次数据，烘焙成静态文件；有变化就提交，并触发 Pages 部署。
# 同时检查买点雷达，跌破档位时推送 Telegram。

on:
  schedule:
    # 每小时的第 3 分钟（错开整点高峰，GitHub 的 cron 在整点最拥堵）
    - cron: '3 * * * *'
  # 代码或页面有改动时立即重新部署，否则改了前端不会生效。
  # 用 paths-ignore（而非 paths）排除自动提交的数据文件，
  # 避免"提交数据 → 触发 push → 再提交"的循环。
  # 注意：paths 与 paths-ignore 不能同时使用。
  push:
    branches: [main]
    paths-ignore:
      - 'public/data.json'
      - 'data/**'
      - '**/*.md'
  workflow_dispatch: # 支持手动触发

# 需要写权限来提交数据，以及部署 Pages
permissions:
  contents: write
  pages: write
  id-token: write

# 避免上一次还没跑完就启动下一次
concurrency:
  group: btc-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取数据并重算（零依赖，无需 npm install）
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node server/update.js

      - name: 提交数据变更
        id: commit
        # 仅在定时任务时提交数据。push 触发时跳过，
        # 否则"提交→触发→再提交"会形成循环。
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json data/snapshot.json data/radar-state.json data/radar-events.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): 自动更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 注入资源版本串
        # GitHub Pages 对静态文件设了 cache-control: max-age=600 且无法覆盖，
        # 用构建时间戳做查询串，确保代码更新后浏览器不会用到旧缓存。
        # 放在提交步骤之后，避免时间戳被写进仓库。
        run: node server/stamp.js "$(date -u +%Y%m%d%H%M%S)"

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
